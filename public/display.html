<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer MAV · KSTI 2026</title>
<link rel="icon" href="img/its.png">
<link rel="stylesheet" href="style.css">
<style>
  /* layar penonton: pas satu layar TV 16:9 tanpa scroll, ukuran ikut layar */
  body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  body > * { flex: none; }
  .lanes { flex: 1 1 0; }
  body.idle { cursor: none; }
  .snd { position: fixed; right: 16px; bottom: 16px; z-index: 5; font: 700 15px/1 var(--f-body); padding: 12px 16px; border: 0; cursor: pointer; }
  .snd.off { background: #ffc83d; color: #08122e; }
  .snd.on { background: var(--soft); color: var(--muted); }
  body.idle .snd.on { opacity: 0; pointer-events: none; }
  .lanes { min-height: 0; }
  .lane { min-height: 0; overflow: hidden; }
  .timer { font-size: min(8.6vw, 15.5vh); }
  .team { font-size: min(2.9vw, 5.6vh); } .team.long { font-size: min(2.2vw, 4.4vh); }
  .status { font-size: min(1.25vw, 2.4vh); }
  .q { font-size: min(1.05vw, 2.1vh); min-height: 0; }
  .teams-sec { padding: 8px 28px 16px; }
  .sec-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .sec-row h2 { font-size: min(1.5vw, 2.8vh); }
  .teams { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(7, auto); }
  .tr { padding: .5vh 0; }
  .tr .tn { font-size: min(1vw, 2vh); } .tr .ts { font-size: min(.8vw, 1.6vh); } .tr .tt { font-size: min(1.15vw, 2.3vh); }
  @media (max-aspect-ratio: 4/3) { /* layar tegak / HP: boleh scroll */
    body { height: auto; overflow: auto; display: block; }
    .hero { grid-template-columns: 1fr; } .clock { text-align: left; }
    .lanes { grid-template-columns: 1fr; } .lane + .lane { border-left: 0; }
    .lane, .track, .teams-sec { padding-left: 16px; padding-right: 16px; }
    .timer { font-size: 22vw; } .team { font-size: 7vw; } .status, .q { font-size: 15px; }
    .teams { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
    .tr .tn { font-size: 16px; } .tr .ts { font-size: 13px; } .tr .tt { font-size: 20px; } .sec-row h2 { font-size: 22px; }
  }
</style>
</head>
<body class="tv">
<header class="hero">
  <div class="logos"><img src="img/ksti.png" alt="KSTI 26"><span class="lsep"></span><img src="img/its.png" class="its" alt="Institut Teknologi Sepuluh Nopember"></div>
  <div class="brand"><h1 class="g-white" id="title">Mini Autonomous Vehicle</h1><div class="sub" id="sub"></div></div>
  <div class="clock"><div class="num big" id="clock">--:--:--</div><div class="date"><span id="date"></span> · WIB<span id="conn" class="conn"></span></div></div>
</header>
<p class="msg" id="msg" hidden></p>
<section class="track" aria-label="Progres lomba">
  <div class="track-head"><span id="phase"></span><span id="overall"></span></div>
  <div class="bar" id="bar"></div>
</section>
<main class="lanes" id="lanes"><p class="empty">Menghubungkan ke server…</p></main>
<section class="teams-sec">
  <div class="sec-row"><h2 class="g-head">Semua tim</h2>
    <div class="legend"><span><i style="background:var(--prep)"></i>Persiapan</span><span><i style="background:var(--race)"></i>Race</span><span><i style="background:var(--rest)"></i>ISHOMA</span><span><i style="background:var(--swap)"></i>Pergantian tim</span></div></div>
  <div class="teams" id="teams"></div>
</section>
<button id="snd" class="snd off">Klik untuk mengaktifkan suara</button>
<script src="common.js"></script>
<script src="sound.js"></script>
<script>
function render() {
  if (!D) return;
  const { W, T } = clockTimes();
  renderCommon(W, T);
  set($('lanes'), D.lanes.map(l => renderLane(l, W, T, 2)).join(''));
  set($('teams'), TEAM_LIST.map(c => renderTeam(c, T, W)).join(''));
  Sound.update(D.lanes, T);
}
connect(render);
setInterval(render, 100); // 10x per detik: pergantian detik & suara telat maks 0,1 dtk
// suara: browser butuh satu klik dulu. Pilihan nyala/mati diingat; bila 'nyala', klik apa pun (mis. dobel-klik layar penuh) langsung mengaktifkan.
let sndPref = null; try { sndPref = localStorage.getItem('mav-sound'); } catch { }
function sndUI() { const b = $('snd'); b.className = 'snd ' + (Sound.on ? 'on' : 'off'); b.textContent = Sound.on ? 'Suara: nyala' : sndPref === '0' ? 'Suara: mati' : 'Klik untuk mengaktifkan suara'; }
function sndSet(on) { if (on) { Sound.enable(); Sound.play('chime'); } else Sound.on = false; sndPref = on ? '1' : '0'; try { localStorage.setItem('mav-sound', sndPref); } catch { } sndUI(); }
$('snd').onclick = e => { e.stopPropagation(); sndSet(!Sound.on); };
$('snd').ondblclick = e => e.stopPropagation();
document.addEventListener('click', () => { if (sndPref !== '0' && !Sound.on && sndPref === '1') { Sound.enable(); sndUI(); } });
sndUI();
// kursor hilang saat diam; klik dua kali = layar penuh
let idleT; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); });
document.addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
</script>
</body>
</html>
